{% extends "base.html" %}
{% block title %}Notifications{% endblock %}
{% block breadcrumb %}Notifications{% endblock %}
{% block content %}
<header class="page-head"><h1>Notifications</h1></header>
<section class="panel padded">
  <ul class="message-list">
    {% for item in items %}
    <li>
      <form method="post" action="{{ url_for('open_notification', item_id=item.id) }}">
        <input type="hidden" name="csrf" value="{{ csrf_token() }}">
        <button class="button outline">{{ 'New reply' if item.kind == 'reply' else 'Status changed' }} on {{ item.ticket_id|reference }} · {{ 'Read' if item.is_read else 'Unread' }}</button>
      </form>
    </li>
    {% else %}<li class="muted">No notifications yet.</li>{% endfor %}
  </ul>
</section>
{% endblock %}
